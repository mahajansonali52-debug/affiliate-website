    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AffiliateHub | Best Curated Deals & Products</title>
    <meta name="description" content="Discover premium product selections across standard automated criteria powered completely on performance criteria frameworks.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero { background: linear-gradient(135deg, var(--bg-secondary), var(--border-color)); padding: 80px 0; text-align: center; }
        .hero h1 { font-size: 2.8rem; margin-bottom: 20px; }
        .search-container { max-width: 600px; margin: 30px auto 0 auto; display: flex; gap: 10px; }
        .search-container input { flex: 1; padding: 15px; border: 1px solid var(--border-color); border-radius: var(--radius); font-size: 1rem; background-color: var(--bg-primary); color: var(--text-primary); }
        .section-title { font-size: 1.8rem; margin: 40px 0 20px 0; text-align: center; }
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .cat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; text-align: center; border-radius: var(--radius); font-weight: 600; box-shadow: var(--shadow); transition: var(--transition); }
        .cat-card:hover { transform: scale(1.03); color: var(--accent); }
    </style>
</head>
<body>

    <header id="global-header-marker"></header>

    <section class="hero">
        <div class="container">
            <h1>Find the Best Deals on Electronics, Gadgets & Accessories</h1>
<p>Compare products, discover top deals, and shop smarter with our curated recommendations.</p>
            <form action="products.html" method="GET" class="search-container">
                <input type="text" name="search" placeholder="Search curated products globally..." required>
                <button type="submit" class="btn">Search</button>
            </form>
        </div>
    </section>

    <div class="container">
        <div class="adsense-placeholder">
            <span>[Google AdSense Broadcast Banner Placeholder Unit]</span>
        </div>
    </div>

    <main class="container">
        <h2 class="section-title">Popular Categories</h2>
        <div class="cat-grid" id="featuredCategories">
            <div class="spinner"></div>
        </div>

        <h2 class="section-title">Featured Spotlights</h2>
        <div class="grid" id="featuredProducts">
            <div class="spinner"></div>
        </div>
    </main>

    <footer id="global-footer-marker"></footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Inline layout dynamic loader execution block
         // Simulated macro processing engine standard runtime logic
        // Injecting functional architecture payload configurations
        (async function initIndexPage() {
            // Apply Manual String Replacement fallback patterns matching template setup models
            // If built on client-side compilation pipelines, parse via generic layout generation procedures
            try {
                const data = await APIManager.fetchProducts();
                
                // Process dynamic categories catalog
                const categorySet = new Set(data.map(p => p.category).filter(Boolean));
                const catContainer = document.getElementById('featuredCategories');
                catContainer.innerHTML = '';
                Array.from(categorySet).slice(0, 4).forEach(cat => {
                    catContainer.innerHTML += `<a href="categories.html?category=${encodeURIComponent(cat)}" class="cat-card">${cat}</a>`;
                });

                // Display limited top 3 items inside spotlight loop module grid configuration matches
                const prodContainer = document.getElementById('featuredProducts');
                prodContainer.innerHTML = '';
                data.slice(0, 3).forEach(p => {
                    prodContainer.innerHTML += createProductCard(p);
                });
                
                lazyLoadImages();
            } catch (err) {
                document.getElementById('featuredCategories').innerHTML = `<p class="error-message">Failed parsing localized configuration catalog items.</p>`;
                document.getElementById('featuredProducts').innerHTML = `<p class="error-message">Database execution stream unexpected disruption mismatch.</p>`;
            }
        })();
    </script>
</body>
</html>
