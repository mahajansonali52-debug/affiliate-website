    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Inventory Warehouse Collection</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .controls-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; margin: 30px 0; }
        .filter-select { padding: 12px 20px; border-radius: var(--radius); background: var(--card-bg); color: var(--text-primary); border:1px solid var(--border-color); font-size: 1rem;}
        .search-input-field { padding: 12px 20px; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary); width: 300px; max-width: 100%;}
    </style>
</head>
<body>
    <div id="global-header-marker"></div>

    <main class="container">
        <div class="controls-row">
            <h1>Catalog Stock Items</h1>
            <input type="text" id="internalSearch" class="search-input-field" placeholder="Filter downstream arrays...">
            <select id="categorySelector" class="filter-select">
                <option value="">All Segment Framework Categories</option>
            </select>
        </div>

        <div class="adsense-placeholder"><span>[AdSense In-Feed Inline Display Section Configuration Area Target]</span></div>

        <div class="grid" id="productsDisplayGrid">
            <div class="spinner"></div>
        </div>
    </main>

    <div id="global-footer-marker"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        let allProductsScope = [];
        const urlParams = new URLSearchParams(window.location.search);
        let activeCategoryFilter = urlParams.get('category') || '';
        let initialSearchQuery = urlParams.get('search') || '';

        document.getElementById('internalSearch').value = initialSearchQuery;

        (async function initCatalogView() {
            try {
                allProductsScope = await APIManager.fetchProducts();
                populateFilters(allProductsScope);
                bindControlEvents();
                renderFilteredOutputGrid();
            } catch(e) {
                document.getElementById('productsDisplayGrid').innerHTML = `<p class="error-message">Failure processing system configuration inventory profiles streams.</p>`;
            }
        })();

        function populateFilters(data) {
            const select = document.getElementById('categorySelector');
            const categories = new Set(data.map(p => p.category).filter(Boolean));
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                if(cat === activeCategoryFilter) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function bindControlEvents() {
            document.getElementById('internalSearch').addEventListener('input', renderFilteredOutputGrid);
            document.getElementById('categorySelector').addEventListener('change', (e) => {
                activeCategoryFilter = e.target.value;
                renderFilteredOutputGrid();
            });
        }

        function renderFilteredOutputGrid() {
            const query = document.getElementById('internalSearch').value.toLowerCase();
            const grid = document.getElementById('productsDisplayGrid');
            grid.innerHTML = '';

            const filtered = allProductsScope.filter(p => {
    const productName = (p.productName || '').toLowerCase();
    const description = (p.description || '').toLowerCase();

    const matchesSearch =
        productName.includes(query) ||
        description.includes(query);

    const matchesCategory =
        !activeCategoryFilter ||
        p.category === activeCategoryFilter;

    return matchesSearch && matchesCategory;
});

            if(filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-secondary);">No products match your criteria specified execution variables parameters.</p>`;
                return;
            }

            filtered.forEach(p => { grid.innerHTML += createProductCard(p); });
            lazyLoadImages();
        }
    </script>
</body>
</html>
